{% load i18n %}<!doctype html>
<html><body style="font-family:Arial,Helvetica,sans-serif;color:#1f2933;line-height:1.5">
<p style="font-size:16px">{{ title }}</p>
<p><a href="{{ url }}" style="background:#0b6e4f;color:#fff;padding:10px 16px;border-radius:6px;text-decoration:none">{% trans "Open" %}</a></p>
<hr style="border:none;border-top:1px solid #e4e7eb">
<p style="font-size:12px;color:#616e7c">{% blocktrans %}You're receiving this because of your notification settings on {{ site_name }}.{% endblocktrans %}
<a href="{{ preferences_url }}">{% trans "Change them" %}</a></p>
</body></html>
