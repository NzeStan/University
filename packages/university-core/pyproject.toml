[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "university-core"
dynamic = ["version"]
description = "University Core: the secure, modular foundation of an African campus platform built on Django REST Framework."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ifeanyi Stanley", email = "nnamaniifeanyi10@gmail.com" }]
keywords = ["django", "drf", "rest", "platform", "campus", "university", "africa", "nigeria", "modular"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "Django>=5.2,<6.2",
    "djangorestframework>=3.15,<4",
    "PyJWT>=2.8,<3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
redis = ["redis>=5.0"]
celery = ["celery>=5.3"]
openapi = ["drf-spectacular>=0.27"]
argon2 = ["argon2-cffi>=23.1"]
oidc = ["PyJWT[crypto]>=2.8,<3"]
images = ["Pillow>=10.0"]
cors = ["django-cors-headers>=4.3"]
all = ["university-core[postgres,redis,celery,openapi,argon2,oidc,images,cors]"]
test = [
    "pytest>=8",
    "pytest-django>=4.8",
    "pytest-cov>=5",
    "drf-spectacular>=0.27",
]

[project.urls]
Homepage = "https://github.com/NzeStan/University"
Documentation = "https://github.com/NzeStan/University/tree/main/docs"
Source = "https://github.com/NzeStan/University"
Changelog = "https://github.com/NzeStan/University/blob/main/CHANGELOG.md"
Issues = "https://github.com/NzeStan/University/issues"

[tool.hatch.version]
path = "src/university/core/__init__.py"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace package: there is deliberately no src/university/__init__.py
packages = ["src/university"]
exclude = ["**/__pycache__"]

[tool.hatch.build.targets.sdist]
include = ["src/university", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["security: security regression tests", "slow: slow tests"]
filterwarnings = ["error::RuntimeWarning"]
