[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "university-institution"
dynamic = ["version"]
description = "University Institution: institutions, campuses, academic structure and verified memberships for the University platform."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ifeanyi Stanley", email = "nnamaniifeanyi10@gmail.com" }]
keywords = ["django", "drf", "university", "institution", "campus", "membership", "africa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# Level-two modules depend only on Core (same minor series).
dependencies = ["university-core>=0.1,<0.2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-django>=4.8", "pytest-cov>=5", "drf-spectacular>=0.27"]

[project.urls]
Homepage = "https://github.com/NzeStan/University"
Documentation = "https://github.com/NzeStan/University/blob/main/docs/modules/institution.md"
Source = "https://github.com/NzeStan/University"
Changelog = "https://github.com/NzeStan/University/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/university/institution/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/university"]
exclude = ["**/__pycache__"]

[tool.hatch.build.targets.sdist]
include = ["src/university", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["security: security regression tests"]
