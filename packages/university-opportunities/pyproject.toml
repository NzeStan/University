[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "university-opportunities"
dynamic = ["version"]
description = "University Opportunities: Jobs, internships, gigs, scholarships and volunteering for students, with applications and scam protection."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ifeanyi Stanley", email = "nnamaniifeanyi10@gmail.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
# Level-two modules depend on Core only. Depend on another module only when
# unavoidable, and never in a cycle.
dependencies = ["university-core>=0.1.1,<0.2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-django>=4.8", "pytest-cov>=5", "drf-spectacular>=0.27"]

[tool.hatch.version]
path = "src/university/opportunities/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/university"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["security: security regression tests"]
