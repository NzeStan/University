name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"  # weekly

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install "bandit[toml]>=1.7"
      - run: bandit -c pyproject.toml -r packages/*/src

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: |
          python -m pip install --upgrade pip  # audit a current pip, not the runner's bundled one
          pip install packages/*/  # one call: siblings resolve locally
      # Audit every third-party dependency. Our own packages are left out: a version bump isn't on
      # PyPI until it's released, and --strict would fail on it.
      - run: pip freeze --exclude-editable | grep -vi '^university-' > /tmp/deps.txt
      - run: |
          pip install pip-audit
          pip-audit --strict --disable-pip --no-deps -r /tmp/deps.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: {languages: python}
      - uses: github/codeql-action/analyze@v3
